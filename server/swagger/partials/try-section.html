<section class="try" data-path="{{TPL_TRY_PATH}}">
  <h4>Try Request</h4>
  <div class="field-grid">{{TPL_TRY_FIELDS}}</div>
  <div class="actions">
    <button type="button" class="run-btn">Send Request</button>
  </div>

  <section>
    <h5>Parameters</h5>
    {{TPL_TRY_PARAMS}}
  </section>

  <section class="result">
    <div class="result-head">
      <span class="status-badge">idle</span>
      <span class="muted-label">Live response</span>
    </div>
    <pre class="result-body">Run request to see response body.</pre>
  </section>
</section>
