<label class="field">
  <span>{{TPL_FIELD_LABEL}}</span>
  <div
    class="api-select"
    data-kind="{{TPL_FIELD_KIND}}"
    data-name="{{TPL_FIELD_NAME}}"
    data-value="{{TPL_FIELD_VALUE}}"
  >
    <button type="button" class="api-select-trigger" aria-expanded="false">
      <span class="api-select-text">{{TPL_FIELD_TEXT}}</span>
      <span class="api-select-icon">▾</span>
    </button>
    <div class="api-select-menu" role="listbox">{{TPL_FIELD_OPTIONS}}</div>
  </div>
</label>
